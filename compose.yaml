services:
  db:
    image: postgres:18-alpine
    container_name: backend-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: postgresdev
      POSTGRES_DB: dev
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
